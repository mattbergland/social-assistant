<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1d9bf0"/>
  
  <!-- Dartboard rings -->
  <circle cx="64" cy="64" r="48" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="64" cy="64" r="36" fill="#e74c3c" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="24" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="12" fill="#e74c3c" stroke="#1a1a2e" stroke-width="1"/>
  
  <!-- Bullseye center -->
  <circle cx="64" cy="64" r="6" fill="#1a1a2e"/>
  
  <!-- Dart -->
  <g transform="translate(64, 64) rotate(-45)">
    <!-- Dart body -->
    <rect x="-3" y="-35" width="6" height="25" fill="#ffd700" rx="1"/>
    <!-- Dart tip -->
    <polygon points="0,-40 -3,-35 3,-35" fill="#c0c0c0"/>
    <!-- Dart flights -->
    <polygon points="0,-10 -8,-5 0,5" fill="#1d9bf0"/>
    <polygon points="0,-10 8,-5 0,5" fill="#1d9bf0"/>
  </g>
</svg>
